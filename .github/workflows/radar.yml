name: Radar gare

on:
  schedule:
    - cron: "17 3 * * *"   # ogni notte alle 03:17 UTC
  workflow_dispatch: {}      # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Scarica e classifica
        run: python -m radar.run
      - name: Pubblica i risultati
        run: |
          git config user.name "radar-gare-bot"
          git config user.email "radar-gare-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Radar gare $(date -u +%Y-%m-%d)"
          git push
